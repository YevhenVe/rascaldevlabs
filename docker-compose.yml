version: "3.9"

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rascaldevlabs-next-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local # <-- Передаем переменные для продакшна
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  next-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rascaldevlabs-next-app-dev
    ports:
      - "3001:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    env_file:
      - .env.local # <-- Передаем переменные для разработки
    environment:
      - NODE_ENV=development
    restart: unless-stopped